name: Repository QA

on:
  push:
    branches: [filehub-dev]
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA tools
        run: python -m pip install --upgrade pip ruff pyyaml

      - name: Compile every Python file
        run: python -m compileall -q bot web tests *.py

      - name: Check critical Python errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Validate shell syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in list(Path('.').glob('*.yml')) + list(Path('.').glob('*.yaml')) + list(Path('.github').rglob('*.yml')) + list(Path('.github').rglob('*.yaml')):
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'OK {path}')
          PY

      - name: Check sample configuration compiles
        run: python -m py_compile config_sample.py
